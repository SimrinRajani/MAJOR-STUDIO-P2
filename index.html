<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCKET — Lo-Fi Sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #C9C6BE; font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 0px; background: transparent; }
  input, textarea, select { outline: none; font-family: monospace; color: #111; }
  button { cursor: pointer; font-family: 'Space Grotesk', sans-serif; border: none; }
  input[type="date"] { color-scheme: light; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ── POCKET BRAND PALETTE (sketchy edition) ────────────────────────────────
const C = {
  bg:        '#F5F3EE',   // paper white
  card:      '#EDEBE5',   // light card
  cardHi:    '#E3E1DA',   // slightly darker card
  text:      '#111',      // near-black
  textSec:   '#555',      // mid gray
  textMut:   '#999',      // muted
  border:    '#BBBBAA',   // warm gray border
  borderDk:  '#888880',   // darker border
  ink:       '#111',      // ink black for outlines
  // Brand colors — like marker on sketch paper
  accent:    '#3B6E4A',   // POCKET forest green
  accentDk:  '#2A5237',   // darker green (hover / shadow)
  accentBg:  '#E8F0EB',   // very light green wash
  accentWarm:'#C05C2A',   // terracotta — secondary / warning
  accentGold:'#B8882A',   // ochre — for match ring / highlights
  btnBg:     '#3B6E4A',   // green primary button
  btnText:   '#F5F3EE',
  shadow:    '#AAAAAA',   // offset shadow color
};

const SPACES = [
  { id: 1, name: 'The Corner Gallery', neighborhood: 'Lower Manhattan', type: 'Gallery', sqft: 850, capacity: 35, available: 'Oct 12–20', price: 'Flexible pricing', match: 94,
    why: 'Intimate gallery layout matches your exhibition format perfectly.',
    reasons: ['Layout fits exhibitions', 'Available Oct 12–20', 'Flexible pricing fits budget', 'Lower Manhattan location'] },
  { id: 2, name: 'Canal Studio', neighborhood: 'Chinatown', type: 'Creative studio', sqft: 620, capacity: 25, available: 'Oct 14–24', price: '$180/day', match: 87,
    why: 'North-facing daylight and open floor plan suit your showcase needs.',
    reasons: ['Natural daylight', 'Flexible layout', 'Within budget', 'Photography-friendly'] },
  { id: 3, name: 'The Green Room', neighborhood: 'Brooklyn', type: 'Community space', sqft: 1100, capacity: 50, available: 'Oct 10–18', price: 'Negotiable', match: 82,
    why: 'Largest capacity option — room to grow your audience on opening night.',
    reasons: ['Highest capacity', 'Negotiable pricing', 'Seating included', 'Oct 10 earliest available'] },
  { id: 4, name: 'Sunset Window', neighborhood: 'Williamsburg', type: 'Storefront', sqft: 900, capacity: 40, available: 'Oct 15–22', price: '$250/day', match: 76,
    why: 'Street-facing windows put your work in front of passersby automatically.',
    reasons: ['Maximum street visibility', 'Williamsburg foot traffic', 'Display-ready layout', 'Above budget — worth discussing'] },
];

// Shared style fragments
const CARD = {
  background: C.card,
  border: `1.5px solid ${C.borderDk}`,
  borderRadius: '3px',
  boxShadow: `2px 2px 0 ${C.shadow}`,
};

function App() {
  const [screen, setScreen] = useState('home');
  const [projectType, setProjectType] = useState(null);
  const [projectTitle, setProjectTitle] = useState('');
  const [projectDesc, setProjectDesc] = useState('');
  const [audienceSize, setAudienceSize] = useState(null);
  const [spaceSize, setSpaceSize] = useState(null);
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [flexDates, setFlexDates] = useState(false);
  const [neighborhoods, setNeighborhoods] = useState([]);
  const [budget, setBudget] = useState(null);
  const [priorities, setPriorities] = useState([]);
  const [savedSpaces, setSavedSpaces] = useState([]);
  const [selectedSpace, setSelectedSpace] = useState(null);
  const [contactName, setContactName] = useState('');
  const [contactEmail, setContactEmail] = useState('');
  const [connectMethod, setConnectMethod] = useState(null);
  const [connectNote, setConnectNote] = useState('');
  const [selectedDate, setSelectedDate] = useState(null);
  const [selectedTime, setSelectedTime] = useState(null);
  const [requests, setRequests] = useState([]);
  const [activeNav, setActiveNav] = useState('discover');
  const [activeChip, setActiveChip] = useState(null);
  const [cardIndex, setCardIndex] = useState(0);
  const [swipedIds, setSwipedIds] = useState([]);
  const [swipeDir, setSwipeDir] = useState(null); // 'left' | 'right' | null

  const navScreens = ['home', 'results', 'saved', 'requests', 'profile'];
  const showBottomNav = navScreens.includes(screen);

  const toggleSave = (spaceId) => {
    setSavedSpaces(prev => prev.includes(spaceId) ? prev.filter(id => id !== spaceId) : [...prev, spaceId]);
  };
  const toggleNeighborhood = (n) => {
    setNeighborhoods(prev => prev.includes(n) ? prev.filter(x => x !== n) : [...prev, n]);
  };
  const togglePriority = (p) => {
    setPriorities(prev => {
      if (prev.includes(p)) return prev.filter(x => x !== p);
      if (prev.length >= 3) return [...prev.slice(1), p];
      return [...prev, p];
    });
  };

  // ── STATUS BAR ────────────────────────────────────────────────────────────
  function StatusBar() {
    return (
      <div style={{ height: '38px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 18px', flexShrink: 0, background: C.accentBg, borderBottom: `1.5px solid ${C.accent}` }}>
        <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '13px', color: C.accent, letterSpacing: '1px' }}>9:41</span>
        <span style={{ fontFamily: 'monospace', fontSize: '9px', color: C.accent, letterSpacing: '2px', textTransform: 'uppercase', opacity: 0.7 }}>POCKET · PROTOTYPE</span>
        <span style={{ fontFamily: 'monospace', fontSize: '12px', color: C.accent }}>▮▮▮</span>
      </div>
    );
  }

  // ── BOTTOM NAV ────────────────────────────────────────────────────────────
  function BottomNav() {
    const tabs = [
      { id: 'discover', label: 'Discover', screen: 'home', icon: (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 9.5L12 3l9 6.5V20H15v-5h-6v5H3V9.5z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/>
        </svg>
      )},
      { id: 'saved', label: 'Saved', screen: 'saved', icon: (
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <path d="M5 3h10v14l-5-3-5 3V3z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/>
        </svg>
      )},
      { id: 'requests', label: 'Requests', screen: 'requests', icon: (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="16" rx="1" stroke="currentColor" strokeWidth="2"/>
          <path d="M3 9h18M8 14h8M8 17h5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="square"/>
        </svg>
      )},
      { id: 'profile', label: 'Profile', screen: 'profile', icon: (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="7" r="4" stroke="currentColor" strokeWidth="2"/>
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" strokeWidth="2" strokeLinecap="square"/>
        </svg>
      )},
    ];
    return (
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: '72px', background: C.bg, borderTop: `2px solid ${C.borderDk}`, display: 'flex', alignItems: 'flex-start', paddingTop: '10px', justifyContent: 'space-around', zIndex: 100 }}>
        {tabs.map(tab => {
          const isActive = activeNav === tab.id;
          return (
            <button key={tab.id} onClick={() => { setActiveNav(tab.id); setScreen(tab.screen); }} style={{ background: 'none', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px', color: isActive ? C.accent : C.textMut, cursor: 'pointer', padding: '0 12px', position: 'relative' }}>
              {isActive && <div style={{ position: 'absolute', top: '-10px', left: '50%', transform: 'translateX(-50%)', width: '28px', height: '3px', background: C.accent }}></div>}
              {tab.icon}
              <span style={{ fontSize: '10px', fontFamily: 'monospace', fontWeight: isActive ? 700 : 400, letterSpacing: '0.5px' }}>{tab.label.toUpperCase()}</span>
            </button>
          );
        })}
      </div>
    );
  }

  // ── TOP BAR ───────────────────────────────────────────────────────────────
  function TopBar({ title, onBack }) {
    return (
      <div style={{ padding: '14px 16px 10px', display: 'flex', alignItems: 'center', gap: '10px', flexShrink: 0, borderBottom: `1px solid ${C.border}`, background: C.bg }}>
        {onBack && (
          <button onClick={onBack} style={{ width: '30px', height: '30px', borderRadius: '2px', background: 'none', border: `1.5px solid ${C.borderDk}`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.text, cursor: 'pointer', flexShrink: 0, boxShadow: `1px 1px 0 ${C.shadow}` }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <polyline points="15,18 9,12 15,6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="square" strokeLinejoin="miter"/>
            </svg>
          </button>
        )}
        {title && <span style={{ fontFamily: "'Caveat', cursive", fontWeight: 600, fontSize: '20px', color: C.text, flex: 1, lineHeight: '1.1' }}>{title}</span>}
        <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '11px', color: C.accent, letterSpacing: '2px', borderBottom: `2px solid ${C.accent}`, paddingBottom: '1px' }}>POCKET</span>
      </div>
    );
  }

  // ── PROGRESS BAR ─────────────────────────────────────────────────────────
  function ProgressBar({ pct }) {
    return (
      <div style={{ height: '4px', background: C.border, flexShrink: 0 }}>
        <div style={{ height: '100%', background: C.accent, width: `${pct}%`, transition: 'width 0.25s ease' }}></div>
      </div>
    );
  }

  // ── PRIMARY BUTTON ────────────────────────────────────────────────────────
  function PrimaryBtn({ label, onClick, disabled }) {
    return (
      <button onClick={onClick} disabled={disabled} style={{
        width: '100%', height: '50px',
        background: disabled ? C.border : C.btnBg,
        color: disabled ? C.textSec : C.btnText,
        borderRadius: '2px',
        border: `2px solid ${disabled ? C.borderDk : C.accentDk}`,
        fontFamily: 'monospace',
        fontWeight: 700,
        fontSize: '13px',
        letterSpacing: '1.5px',
        textTransform: 'uppercase',
        cursor: disabled ? 'not-allowed' : 'pointer',
        boxShadow: disabled ? 'none' : `3px 3px 0 ${C.shadow}`,
        transition: 'box-shadow 0.1s',
      }}>
        {label}
      </button>
    );
  }

  // ── INPUT FIELD ───────────────────────────────────────────────────────────
  function InputField({ label, value, onChange, placeholder, type }) {
    return (
      <div style={{ marginBottom: '14px' }}>
        {label && <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textSec, marginBottom: '5px', letterSpacing: '1.5px', textTransform: 'uppercase' }}>{label}</div>}
        <input type={type || 'text'} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={{
          width: '100%', background: '#FAFAF7',
          border: `1.5px solid ${C.borderDk}`,
          borderRadius: '2px', padding: '10px 12px',
          color: C.text, fontSize: '14px', fontFamily: 'monospace',
          boxShadow: `2px 2px 0 ${C.shadow}`,
        }} />
      </div>
    );
  }

  // ── TEXTAREA ──────────────────────────────────────────────────────────────
  function TextareaField({ label, value, onChange, placeholder, rows }) {
    return (
      <div style={{ marginBottom: '14px' }}>
        {label && <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textSec, marginBottom: '5px', letterSpacing: '1.5px', textTransform: 'uppercase' }}>{label}</div>}
        <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={rows || 3} style={{
          width: '100%', background: '#FAFAF7',
          border: `1.5px solid ${C.borderDk}`,
          borderRadius: '2px', padding: '10px 12px',
          color: C.text, fontSize: '14px', fontFamily: 'monospace',
          resize: 'none', lineHeight: '1.5',
          boxShadow: `2px 2px 0 ${C.shadow}`,
        }} />
      </div>
    );
  }

  // ── SELECTABLE CHIP ───────────────────────────────────────────────────────
  function SelectableChip({ label, selected, onClick }) {
    return (
      <button onClick={onClick} style={{
        background: selected ? C.accent : '#FAFAF7',
        border: `1.5px solid ${selected ? C.accentDk : C.borderDk}`,
        borderRadius: '2px',
        padding: '6px 12px',
        color: selected ? C.btnText : C.text,
        fontSize: '12px',
        fontFamily: 'monospace',
        fontWeight: selected ? 700 : 400,
        cursor: 'pointer',
        letterSpacing: '0.3px',
        whiteSpace: 'nowrap',
        boxShadow: selected ? `2px 2px 0 ${C.accentDk}` : `1px 1px 0 ${C.shadow}`,
      }}>
        {label}
      </button>
    );
  }

  // ── SPACE PLACEHOLDER SVG ─────────────────────────────────────────────────
  function SpaceCardSVG({ type, width = '100%', height = '100%' }) {
    const labels = {
      'Gallery': '[ GALLERY ]',
      'Creative studio': '[ STUDIO ]',
      'Community space': '[ COMMUNITY ]',
      'Storefront': '[ STOREFRONT ]',
    };
    const label = labels[type] || '[ SPACE ]';
    return (
      <svg viewBox="0 0 200 130" width={width} height={height} style={{ display: 'block' }}>
        {/* Hatching pattern */}
        <defs>
          <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="8" stroke="#CCCCBB" strokeWidth="1"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="200" height="130" fill="url(#hatch)"/>
        {/* Rough frame lines */}
        <rect x="10" y="10" width="180" height="110" fill="none" stroke="#AAAAAA" strokeWidth="1.5" strokeDasharray="5,3"/>
        {/* Center box */}
        <rect x="55" y="35" width="90" height="60" fill="#E0DED5" stroke="#999" strokeWidth="1.5"/>
        {/* X marks across center box */}
        <line x1="55" y1="35" x2="145" y2="95" stroke="#BBBBAA" strokeWidth="1"/>
        <line x1="145" y1="35" x2="55" y2="95" stroke="#BBBBAA" strokeWidth="1"/>
        {/* Label */}
        {/* Accent color stripe at bottom */}
        <rect x="0" y="118" width="200" height="12" fill="#3B6E4A" opacity="0.18"/>
        <text x="100" y="127" textAnchor="middle" fontFamily="monospace" fontSize="8" fill="#3B6E4A" letterSpacing="1" fontWeight="700">{label}</text>
      </svg>
    );
  }

  // ── SECTION LABEL ─────────────────────────────────────────────────────────
  function SectionLabel({ text }) {
    return (
      <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textSec, letterSpacing: '2px', textTransform: 'uppercase', marginBottom: '10px', borderBottom: `1px solid ${C.border}`, paddingBottom: '5px' }}>
        {text}
      </div>
    );
  }

  // ══════════════════════════════════════════════════════════════════════════
  // SCREENS
  // ══════════════════════════════════════════════════════════════════════════

  function HomeScreen() {
    const categoryChips = ['Exhibitions', 'Creative showcases', 'Pop-ups', 'Workshops'];
    return (
      <div style={{ paddingBottom: '72px' }}>
        {/* Wordmark row */}
        <div style={{ padding: '16px 16px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: `2px solid ${C.accent}`, background: C.accentBg }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <div style={{ width: '28px', height: '28px', border: `2px solid ${C.accentDk}`, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.accent, boxShadow: `2px 2px 0 ${C.accentDk}` }}>
              <svg viewBox="0 0 14 14" width="13" height="13">
                <path d="M7,12 L3,12 L2,5 L3,2 L11,2 L12,5 L11,12 Z" fill="none" stroke="#F5F3EE" strokeWidth="1.8"/>
              </svg>
            </div>
            <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '17px', color: C.accent, letterSpacing: '3px' }}>POCKET</span>
          </div>
          <div style={{ width: '30px', height: '30px', border: `1.5px solid ${C.borderDk}`, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.card, boxShadow: `1px 1px 0 ${C.shadow}` }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="7" r="4" stroke={C.textSec} strokeWidth="2"/>
              <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke={C.textSec} strokeWidth="2" strokeLinecap="square"/>
            </svg>
          </div>
        </div>

        {/* Eyebrow */}
        <div style={{ padding: '14px 16px 0' }}>
          <div style={{ fontFamily: 'monospace', fontSize: '9px', color: C.accent, letterSpacing: '2.5px', textTransform: 'uppercase', marginBottom: '8px', opacity: 0.8 }}>// NYC · CREATIVE SPACES</div>
          <h1 style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '32px', color: C.text, lineHeight: '1.1', marginBottom: '10px' }}>Your next creative project needs a place.</h1>
          <p style={{ fontSize: '13px', color: C.textSec, lineHeight: '1.6', marginBottom: '16px', fontFamily: 'monospace' }}>Find temporary spaces for exhibitions, showcases, and ideas worth bringing to life.</p>
        </div>

        {/* Illustration placeholder */}
        <div style={{ margin: '0 16px 16px', border: `1.5px solid ${C.borderDk}`, background: C.card, boxShadow: `3px 3px 0 ${C.shadow}`, overflow: 'hidden' }}>
          <svg viewBox="0 0 340 160" width="100%" height="140">
            <defs>
              <pattern id="hatchBg" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
                <line x1="0" y1="0" x2="0" y2="10" stroke="#DDDDD0" strokeWidth="1"/>
              </pattern>
            </defs>
            <rect width="340" height="160" fill="url(#hatchBg)"/>
            {/* Pocket outline - center */}
            <path d="M170,140 L130,140 L122,72 L130,50 L210,50 L218,72 L210,140 Z" fill="none" stroke={C.borderDk} strokeWidth="2"/>
            {/* Stitching */}
            <path d="M135,140 L127,76 L134,55 L206,55 L213,76 L205,140" fill="none" stroke={C.textMut} strokeWidth="1" strokeDasharray="5,4"/>
            {/* Stars emerging */}
            <text x="170" y="45" textAnchor="middle" fontSize="18" fill={C.textSec}>✦</text>
            <text x="148" y="38" textAnchor="middle" fontSize="10" fill={C.textMut}>✦</text>
            <text x="194" y="40" textAnchor="middle" fontSize="8" fill={C.textMut}>✦</text>
            {/* Caption */}
            <text x="170" y="155" textAnchor="middle" fontFamily="monospace" fontSize="8" fill={C.textMut} letterSpacing="2">[ CREATIVE SPACE ILLUSTRATION ]</text>
          </svg>
        </div>

        {/* CTAs */}
        <div style={{ padding: '0 16px', marginBottom: '10px' }}>
          <PrimaryBtn label="→ Find my space" onClick={() => setScreen('type')} />
        </div>
        <div style={{ textAlign: 'center', marginBottom: '22px' }}>
          <span style={{ fontSize: '12px', color: C.textSec, cursor: 'pointer', fontFamily: 'monospace', textDecoration: 'underline' }}>I have a space →</span>
        </div>

        {/* Category chips */}
        <div style={{ padding: '0 16px', marginBottom: '8px' }}>
          <SectionLabel text="Explore possibilities" />
          <div style={{ display: 'flex', gap: '6px', overflowX: 'auto', paddingBottom: '4px' }}>
            {categoryChips.map(chip => (
              <SelectableChip key={chip} label={chip} selected={activeChip === chip} onClick={() => setActiveChip(activeChip === chip ? null : chip)} />
            ))}
          </div>
        </div>

        {/* Space previews */}
        <div style={{ padding: '18px 16px 0' }}>
          <SectionLabel text="Spaces with potential" />
          {SPACES.slice(0, 2).map(space => (
            <div key={space.id} onClick={() => { setSelectedSpace(space); setScreen('detail'); }}
              style={{ ...CARD, marginBottom: '12px', overflow: 'hidden', cursor: 'pointer' }}>
              <div style={{ height: '120px', background: C.cardHi, overflow: 'hidden' }}>
                <SpaceCardSVG type={space.type} />
              </div>
              <div style={{ padding: '12px' }}>
                <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '14px', color: C.text, marginBottom: '3px' }}>{space.name}</div>
                <div style={{ fontSize: '11px', color: C.textSec, marginBottom: '6px', fontFamily: 'monospace' }}>{space.neighborhood} · {space.type}</div>
                <div style={{ fontSize: '11px', color: C.textSec, fontFamily: 'monospace' }}>{space.price}</div>
                <div style={{ marginTop: '8px', fontSize: '11px', color: C.accent, fontFamily: 'monospace', fontWeight: 700, textDecoration: 'underline' }}>View space →</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function TypeScreen() {
    const types = [
      { id: 'exhibition', label: 'Exhibition', mark: '[ □ ]' },
      { id: 'showcase', label: 'Creative showcase', mark: '[ ✦ ]' },
      { id: 'popup', label: 'Pop-up presentation', mark: '[ ◻ ]' },
      { id: 'other', label: 'Other creative project', mark: '[ / ]' },
    ];
    return (
      <div>
        <TopBar title="What are you planning?" onBack={() => setScreen('home')} />
        <ProgressBar pct={20} />
        <div style={{ padding: '16px 16px 20px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '18px' }}>
            {types.map(t => (
              <div key={t.id} onClick={() => setProjectType(t.id)} style={{
                background: projectType === t.id ? C.ink : '#FAFAF7',
                border: `2px solid ${projectType === t.id ? C.ink : C.borderDk}`,
                borderRadius: '2px',
                padding: '16px 12px',

  function ResultsScreen() {
    const deck = SPACES; // all 4 cards
    const current = deck[cardIndex];
    const allDone = cardIndex >= deck.length;

    const handlePass = () => {
      setSwipeDir('left');
      setTimeout(() => {
        setSwipedIds(prev => [...prev, current.id]);
        setCardIndex(i => i + 1);
        setSwipeDir(null);
      }, 220);
    };
    const handlePocket = () => {
      setSwipeDir('right');
      toggleSave(current.id);
      setTimeout(() => {
        setSwipedIds(prev => [...prev, current.id]);
        setCardIndex(i => i + 1);
        setSwipeDir(null);
      }, 220);
    };
    const handleReset = () => { setCardIndex(0); setSwipedIds([]); };

    // Match ring arc path helper
    function MatchRing({ pct }) {
      const r = 22, cx = 28, cy = 28;
      const circ = 2 * Math.PI * r;
      const dash = (pct / 100) * circ;
      return (
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.accentBg} strokeWidth="3.5"/>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.accentGold} strokeWidth="3.5"
            strokeDasharray={`${dash} ${circ}`}
            strokeDashoffset={circ * 0.25}
            strokeLinecap="butt"
            transform="rotate(-90 28 28)"
          />
          <text x={cx} y={cy + 4} textAnchor="middle" fontFamily="monospace" fontWeight="700" fontSize="11" fill={C.accentGold}>{pct}%</text>
        </svg>
      );
    }

    if (allDone) {
      return (
        <div style={{ paddingBottom: '72px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '700px', padding: '28px 20px' }}>
          <div style={{ border: `2px solid ${C.ink}`, padding: '28px 24px', textAlign: 'center', boxShadow: `4px 4px 0 ${C.shadow}`, background: C.card, maxWidth: '300px' }}>
            <div style={{ fontFamily: "'Caveat', cursive", fontSize: '40px', marginBottom: '8px' }}>—</div>
            <div style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '24px', color: C.text, marginBottom: '10px' }}>That's all of them.</div>
            <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, lineHeight: '1.7', marginBottom: '18px' }}>
              {savedSpaces.length > 0
                ? `You pocketed ${savedSpaces.length} space${savedSpaces.length > 1 ? 's' : ''}.`
                : 'No spaces pocketed yet.'}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
              {savedSpaces.length > 0 && (
                <button onClick={() => { setScreen('saved'); setActiveNav('saved'); }} style={{ width: '100%', height: '42px', background: C.ink, color: C.btnText, border: `2px solid ${C.ink}`, borderRadius: '2px', fontFamily: 'monospace', fontWeight: 700, fontSize: '11px', letterSpacing: '1px', cursor: 'pointer', boxShadow: `2px 2px 0 ${C.shadow}` }}>
                  VIEW SAVED SPACES →
                </button>
              )}
              <button onClick={handleReset} style={{ width: '100%', height: '42px', background: '#FAFAF7', color: C.text, border: `1.5px solid ${C.borderDk}`, borderRadius: '2px', fontFamily: 'monospace', fontWeight: 700, fontSize: '11px', letterSpacing: '1px', cursor: 'pointer', boxShadow: `2px 2px 0 ${C.shadow}` }}>
                ↺ START OVER
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Cards left count for stack preview
    const remaining = deck.length - cardIndex;

    return (
      <div style={{ paddingBottom: '72px', display: 'flex', flexDirection: 'column', height: '100%' }}>
        {/* Header */}
        <div style={{ padding: '12px 16px 8px', borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>

            <div style={{ fontFamily: 'monospace', fontSize: '9px', color: C.textSec, letterSpacing: '1.5px', marginTop: '2px' }}>{remaining} SPACE{remaining !== 1 ? 'S' : ''} REMAINING</div>
          </div>
          <div style={{ display: 'flex', gap: '4px' }}>
            {deck.map((_, i) => (
              <div key={i} style={{ width: '18px', height: '3px', background: i < cardIndex ? C.border : C.accent, borderRadius: '1px' }}></div>
            ))}
          </div>
        </div>

        {/* Card stack area */}
        <div style={{ flex: 1, position: 'relative', padding: '12px 16px 8px', overflow: 'hidden' }}>

          {/* Ghost cards behind (stack effect) */}
          {remaining > 1 && (
            <div style={{ position: 'absolute', top: '18px', left: '22px', right: '22px', bottom: '14px', background: C.cardHi, border: `1.5px solid ${C.borderDk}`, borderRadius: '3px', zIndex: 1, boxShadow: `2px 2px 0 ${C.shadow}` }}></div>
          )}
          {remaining > 2 && (
            <div style={{ position: 'absolute', top: '22px', left: '26px', right: '26px', bottom: '18px', background: C.card, border: `1px solid ${C.border}`, borderRadius: '3px', zIndex: 0 }}></div>

          {/* Active card */}
          <div style={{

            borderRadius: '3px',
            boxShadow: `4px 4px 0 ${C.shadow}`,
            zIndex: 2,
            overflow: 'hidden',
            display: 'flex', flexDirection: 'column',
            transform: swipeDir === 'left' ? 'translateX(-120%) rotate(-8deg)' : swipeDir === 'right' ? 'translateX(120%) rotate(8deg)' : 'translateX(0) rotate(0deg)',
            transition: swipeDir ? 'transform 0.22s ease-in' : 'none',
          }}>

            {/* Photo placeholder */}
            <div style={{ height: '210px', background: C.cardHi, borderBottom: `2px solid ${C.ink}`, position: 'relative', flexShrink: 0, overflow: 'hidden' }}>
              <SpaceCardSVG type={current.type} width="100%" height="210px" />

              {/* PASS / POCKET badge overlays on swipe hint */}
              {swipeDir === 'left' && (

              {swipeDir === 'right' && (
                <div style={{ position: 'absolute', top: '16px', right: '14px', border: `3px solid ${C.accent}`, borderRadius: '2px', padding: '4px 10px', transform: 'rotate(12deg)', background: 'rgba(232,240,235,0.92)' }}>
                  <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '18px', color: C.accent, letterSpacing: '2px' }}>POCKET</span>
                </div>

              {/* Match % badge */}
              <div style={{ position: 'absolute', top: '10px', right: '10px', background: '#FAFAF8', border: `2px solid ${C.ink}`, borderRadius: '2px', padding: '3px', boxShadow: `2px 2px 0 ${C.shadow}` }}>
                <MatchRing pct={current.match} />
                <div style={{ fontFamily: 'monospace', fontSize: '7px', color: C.textSec, textAlign: 'center', letterSpacing: '0.5px', marginTop: '1px' }}>MATCH</div>
              </div>
            </div>

            {/* Card body — scrollable */}
            <div style={{ flex: 1, overflowY: 'auto', padding: '12px 14px 10px' }}>
              {/* Name + hood */}
              <div style={{ marginBottom: '8px' }}>

              {/* Quick stats row */}
              <div style={{ display: 'flex', gap: '5px', marginBottom: '10px', flexWrap: 'wrap' }}>
                {[`${current.sqft} sqft`, `${current.capacity} ppl`, current.price, current.available].map(tag => (

                ))}
              </div>

              {/* WHY IT MATCHES — the key Hinge-style block */}
              <div style={{ border: `2px solid ${C.accent}`, borderRadius: '2px', padding: '10px 12px', marginBottom: '10px', background: C.accentBg, boxShadow: `2px 2px 0 ${C.accentDk}` }}>
                <div style={{ fontFamily: 'monospace', fontSize: '8px', color: C.accent, letterSpacing: '2px', textTransform: 'uppercase', marginBottom: '5px', fontWeight: 700 }}>✦ WHY IT MATCHES</div>
                <div style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '17px', color: C.text, lineHeight: 1.4, marginBottom: '9px' }}>{current.why}</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                  {current.reasons.map((r, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: '7px' }}>
                      <span style={{ fontFamily: 'monospace', fontSize: '10px', color: C.accent, marginTop: '1px', flexShrink: 0, fontWeight: 700 }}>↳</span>
                      <span style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, lineHeight: 1.4 }}>{r}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* See full profile link */}
              <button onClick={() => { setSelectedSpace(current); setScreen('detail'); }} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.accent, fontSize: '11px', fontFamily: 'monospace', fontWeight: 700, textDecoration: 'underline', padding: 0, letterSpacing: '0.5px' }}>

              </button>
            </div>
          </div>
        </div>

          {/* PASS */}

            width: '64px', height: '64px',
            background: '#FAFAF8',
            border: `2px solid ${C.borderDk}`,
            borderRadius: '2px',
            cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '2px',
            boxShadow: `3px 3px 0 ${C.shadow}`,

            <span style={{ fontFamily: 'monospace', fontSize: '8px', letterSpacing: '1px' }}>POCKET</span>
          </button>
        </div>
      </div>
    );

    return (
      <div>
        <TopBar title="Tell us about you" onBack={() => setScreen('detail')} />
        <div style={{ padding: '10px 16px 4px' }}>
          <p style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec }}>Only needed to send an introduction request.</p>
        </div>
        <div style={{ padding: '12px 16px 20px' }}>
          <InputField label="Your name" value={contactName} onChange={setContactName} placeholder="full name" />
          <InputField label="Email" value={contactEmail} onChange={setContactEmail} placeholder="your@email.com" type="email" />
          <InputField label="Project title" value={projectTitle} onChange={setProjectTitle} placeholder="what's this called?" />
          <TextareaField label="Describe your project" value={projectDesc} onChange={setProjectDesc} placeholder="tell the space holder what you're creating…" rows={3} />
          <TextareaField label="Setup notes (optional)" value={''} onChange={() => {}} placeholder="anything to know about setup?" rows={2} />
          <PrimaryBtn label="→ Continue" onClick={() => setScreen('connect')} />
        </div>
      </div>
    );
  }

  function ConnectScreen() {
    const methods = [
      { id: 'question', label: 'Ask a question', sub: 'Send a message to the space holder', mark: '[ ? ]' },
      { id: 'walkthrough', label: 'Request a walkthrough', sub: 'Schedule an in-person visit', mark: '[ ◎ ]' },
      { id: 'pricing', label: 'Discuss availability & pricing', sub: 'Get details before committing', mark: '[ $ ]' },
    ];
    return (
      <div>
        <TopBar title="How would you like to connect?" onBack={() => setScreen('signup')} />
        <div style={{ padding: '14px 16px 20px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '16px' }}>
            {methods.map(m => (
              <div key={m.id} onClick={() => setConnectMethod(m.id)} style={{
                background: connectMethod === m.id ? C.ink : '#FAFAF7',
                border: `2px solid ${connectMethod === m.id ? C.ink : C.borderDk}`,
                borderRadius: '2px', padding: '14px', cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: '12px',
                boxShadow: `2px 2px 0 ${connectMethod === m.id ? '#555' : C.shadow}`,
              }}>
                <span style={{ fontFamily: "'Caveat', cursive", fontWeight: 600, fontSize: '22px', color: connectMethod === m.id ? C.btnText : C.textSec, flexShrink: 0 }}>{m.mark}</span>
                <div>
                  <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '12px', color: connectMethod === m.id ? C.btnText : C.text, marginBottom: '3px' }}>{m.label}</div>
                  <div style={{ fontFamily: 'monospace', fontSize: '10px', color: connectMethod === m.id ? 'rgba(245,243,238,0.7)' : C.textSec }}>{m.sub}</div>
                </div>
              </div>
            ))}
          </div>
          <TextareaField label="Add a note (optional)" value={connectNote} onChange={setConnectNote} placeholder="anything specific you'd like to say?" rows={3} />
          <PrimaryBtn label="→ Choose a time" onClick={() => setScreen('schedule')} disabled={!connectMethod} />
        </div>
      </div>
    );
  }

  function ScheduleScreen() {
    const availableDates = [10,11,12,14,15,16,17,18,19,21,22];
    const times = ['11:00 AM', '1:30 PM', '3:00 PM', '5:30 PM'];
    const days = ['Mo','Tu','We','Th','Fr','Sa','Su'];
    const offset = 3; // Oct 1 = Thursday
    const cells = [];
    for (let i = 0; i < Math.ceil((offset + 31) / 7) * 7; i++) {
      const d = i - offset + 1;
      cells.push(d >= 1 && d <= 31 ? d : null);
    }
    return (
      <div>
        <TopBar title="Find a time to connect." onBack={() => setScreen('connect')} />
        <div style={{ padding: '8px 16px 4px' }}>
          <p style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textSec }}>* Sample times — actual availability needs confirmation.</p>
        </div>
        <div style={{ padding: '10px 16px 20px' }}>
          <div style={{ ...CARD, padding: '14px', marginBottom: '14px' }}>
            <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '12px', color: C.text, textAlign: 'center', marginBottom: '10px', letterSpacing: '2px' }}>OCTOBER 2026</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '3px', marginBottom: '6px' }}>
              {days.map(d => <div key={d} style={{ textAlign: 'center', fontFamily: 'monospace', fontSize: '9px', color: C.textSec, padding: '3px 0', letterSpacing: '0.5px' }}>{d}</div>)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '3px' }}>
              {cells.map((dateNum, idx) => {
                if (!dateNum) return <div key={idx} style={{ height: '28px' }}></div>;
                const avail = availableDates.includes(dateNum);
                const sel = selectedDate === dateNum;
                return (
                  <div key={idx} onClick={() => avail && setSelectedDate(sel ? null : dateNum)} style={{
                    height: '28px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: 'monospace', fontSize: '12px', fontWeight: sel ? 700 : avail ? 500 : 400,
                    background: sel ? C.ink : 'transparent',
                    color: sel ? C.btnText : avail ? C.text : C.border,
                    cursor: avail ? 'pointer' : 'default',
                    border: sel ? `1px solid ${C.ink}` : 'none',
                    borderRadius: '1px',
                  }}>
                    {dateNum}
                  </div>
                );
              })}
            </div>
          </div>
          {selectedDate && (
            <div style={{ marginBottom: '14px' }}>
              <SectionLabel text={`Available times · Oct ${selectedDate}`} />
              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                {times.map(t => (
                  <div key={t} onClick={() => setSelectedTime(t === selectedTime ? null : t)} style={{
                    background: selectedTime === t ? C.ink : '#FAFAF7',
                    border: `1.5px solid ${selectedTime === t ? C.ink : C.borderDk}`,
                    borderRadius: '2px', padding: '11px 14px',
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    cursor: 'pointer', boxShadow: `1px 1px 0 ${C.shadow}`,
                  }}>
                    <span style={{ fontFamily: 'monospace', fontSize: '13px', color: selectedTime === t ? C.btnText : C.text }}>{t}</span>
                    {selectedTime === t && <span style={{ fontFamily: 'monospace', fontSize: '12px', color: C.btnText }}>✓</span>}
                  </div>
                ))}
              </div>
            </div>
          )}
          <PrimaryBtn label="→ Review request" onClick={() => setScreen('review')} disabled={!selectedDate || !selectedTime} />
        </div>
      </div>
    );
  }

  function ReviewScreen() {
    const methodLabels = { question: 'Ask a question', walkthrough: 'Request a walkthrough', pricing: 'Discuss availability and pricing' };
    const rows = [
      { label: 'PROJECT TYPE', value: projectType ? projectType.charAt(0).toUpperCase() + projectType.slice(1) : '—', goTo: 'type' },
      { label: 'PROJECT TITLE', value: projectTitle || 'Untitled project', goTo: 'type' },
      { label: 'DATES', value: startDate && endDate ? `${startDate} – ${endDate}` : flexDates ? 'Flexible' : '—', goTo: 'date' },
      { label: 'LOCATION', value: neighborhoods.length ? neighborhoods.join(', ') : '—', goTo: 'location' },
      { label: 'AUDIENCE', value: audienceSize || '—', goTo: 'size' },
      { label: 'BUDGET', value: budget || '—', goTo: 'budget' },
      { label: 'SPACE', value: selectedSpace ? `${selectedSpace.name}` : '—', goTo: 'results' },
      { label: 'CONNECT VIA', value: connectMethod ? methodLabels[connectMethod] : '—', goTo: 'connect' },
      { label: 'PREFERRED TIME', value: selectedDate && selectedTime ? `Oct ${selectedDate} at ${selectedTime}` : '—', goTo: 'schedule' },
    ];
    const handleSend = () => {
      setRequests(prev => [...prev, { id: Date.now(), space: selectedSpace, projectTitle: projectTitle || 'Untitled project', connectMethod, date: selectedDate ? `Oct ${selectedDate}` : '', time: selectedTime || '' }]);
      setScreen('confirm');
    };
    return (
      <div>
        <TopBar title="Review your request" onBack={() => setScreen('schedule')} />
        <div style={{ padding: '14px 16px 20px' }}>
          <div style={{ ...CARD, overflow: 'hidden', marginBottom: '16px' }}>
            {rows.map((row, i) => (
              <div key={row.label} style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', padding: '9px 12px', borderBottom: i < rows.length - 1 ? `1px solid ${C.border}` : 'none', gap: '8px' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'monospace', fontSize: '9px', color: C.textSec, letterSpacing: '1.5px', marginBottom: '2px' }}>{row.label}</div>
                  <div style={{ fontFamily: 'monospace', fontSize: '12px', color: C.text }}>{row.value}</div>
                </div>
                <button onClick={() => setScreen(row.goTo)} style={{ background: 'none', border: 'none', color: C.ink, fontSize: '10px', fontFamily: 'monospace', fontWeight: 700, cursor: 'pointer', flexShrink: 0, textDecoration: 'underline' }}>EDIT</button>
              </div>
            ))}
          </div>
          <PrimaryBtn label="→ Send introduction request" onClick={handleSend} />
        </div>
      </div>
    );
  }

  function ConfirmScreen() {
    const methodLabels = { question: 'Ask a question', walkthrough: 'Walkthrough', pricing: 'Discuss pricing' };
    return (
      <div style={{ padding: '28px 20px 28px', display: 'flex', flexDirection: 'column', alignItems: 'center', minHeight: '600px' }}>
        {/* Big sketchy checkmark illustration */}
        <div style={{ width: '90px', height: '90px', border: `3px solid ${C.ink}`, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '24px', marginTop: '16px', background: C.card, boxShadow: `4px 4px 0 ${C.shadow}` }}>
          <svg viewBox="0 0 50 50" width="50" height="50" fill="none">
            <path d="M40,15 L22,37 L12,27" stroke={C.ink} strokeWidth="4" strokeLinecap="square" strokeLinejoin="miter"/>
          </svg>
        </div>
        <h2 style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '30px', color: C.text, textAlign: 'center', lineHeight: '1.1', marginBottom: '14px' }}>Your next step is in motion.</h2>
        <div style={{ border: `1px dashed ${C.borderDk}`, padding: '10px 14px', marginBottom: '18px', background: '#FAFAF7', maxWidth: '320px' }}>
          <p style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, textAlign: 'center', lineHeight: '1.7' }}>This prototype does not send a real request. In a live POCKET experience, the space holder would review your project and respond about availability, pricing, and next steps.</p>
        </div>
        {selectedSpace && (
          <div style={{ ...CARD, padding: '12px 14px', width: '100%', marginBottom: '20px' }}>
            <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '13px', color: C.text, marginBottom: '3px' }}>{selectedSpace.name}</div>
            <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, marginBottom: '6px' }}>{selectedSpace.neighborhood}</div>
            {connectMethod && <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.ink }}>→ {methodLabels[connectMethod] || connectMethod}</div>}
          </div>
        )}
        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', width: '100%' }}>
          <PrimaryBtn label="→ View my requests" onClick={() => { setScreen('requests'); setActiveNav('requests'); }} />
          <div style={{ textAlign: 'center' }}>
            <button onClick={() => { setScreen('results'); setActiveNav('discover'); }} style={{ background: 'none', border: 'none', color: C.textSec, fontSize: '11px', cursor: 'pointer', fontFamily: 'monospace', textDecoration: 'underline' }}>Explore more spaces →</button>
          </div>
        </div>
      </div>
    );
  }

  function SavedScreen() {
    const saved = SPACES.filter(s => savedSpaces.includes(s.id));
    return (
      <div style={{ paddingBottom: '72px' }}>
        <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}` }}>
          <h2 style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '26px', color: C.text }}>Your pocket</h2>
        </div>
        {saved.length === 0 ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '420px', padding: '28px 24px' }}>
            <svg viewBox="0 0 80 80" width="80" height="80" fill="none" style={{ marginBottom: '18px' }}>
              <path d="M40,68 L22,68 L16,30 L22,14 L58,14 L64,30 L58,68 Z" stroke={C.textMut} strokeWidth="2"/>
              <path d="M28,14 L28,10 C28,6.7 30.7,4 34,4 L46,4 C49.3,4 52,6.7 52,10 L52,14" stroke={C.textMut} strokeWidth="2"/>
              <line x1="22" y1="30" x2="58" y2="30" stroke={C.textMut} strokeWidth="1.5"/>
            </svg>
            <p style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '22px', color: C.text, textAlign: 'center', marginBottom: '8px' }}>Your pocket is waiting to be filled.</p>
            <p style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, textAlign: 'center', marginBottom: '22px' }}>Save spaces while you browse to compare them later.</p>
            <button onClick={() => { setScreen('results'); setActiveNav('discover'); }} style={{ background: C.ink, color: C.btnText, border: `2px solid ${C.ink}`, borderRadius: '2px', padding: '10px 20px', fontFamily: 'monospace', fontWeight: 700, fontSize: '11px', cursor: 'pointer', letterSpacing: '1px', boxShadow: `2px 2px 0 ${C.shadow}` }}>DISCOVER SPACES →</button>
          </div>
        ) : (
          <div style={{ padding: '12px 16px' }}>
            {saved.map(space => (
              <div key={space.id} onClick={() => { setSelectedSpace(space); setScreen('detail'); }} style={{ ...CARD, padding: '12px', marginBottom: '10px', cursor: 'pointer', display: 'flex', gap: '12px', alignItems: 'center' }}>
                <div style={{ width: '56px', height: '56px', background: C.cardHi, border: `1px solid ${C.border}`, flexShrink: 0, overflow: 'hidden' }}>
                  <SpaceCardSVG type={space.type} width="56" height="56" />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '13px', color: C.text, marginBottom: '3px' }}>{space.name}</div>
                  <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textSec, marginBottom: '3px' }}>{space.neighborhood} · {space.type}</div>
                  <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.text }}>{space.price}</div>
                </div>
                <span style={{ fontFamily: 'monospace', color: C.textSec, fontSize: '14px' }}>›</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  function RequestsScreen() {
    const methodLabels = { question: 'Ask a question', walkthrough: 'Walkthrough requested', pricing: 'Discuss availability & pricing' };
    return (
      <div style={{ paddingBottom: '72px' }}>
        <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}` }}>
          <h2 style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '26px', color: C.text }}>Your requests</h2>
        </div>
        {requests.length === 0 ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '380px', padding: '28px 24px' }}>
            <div style={{ border: `1.5px dashed ${C.borderDk}`, padding: '20px', marginBottom: '18px', opacity: 0.6 }}>
              <svg viewBox="0 0 60 50" width="60" height="50" fill="none">
                <rect x="5" y="5" width="50" height="40" rx="2" stroke={C.textSec} strokeWidth="2"/>
                <path d="M5 18h50" stroke={C.textSec} strokeWidth="1.5"/>
                <path d="M14 29h22M14 35h14" stroke={C.textSec} strokeWidth="1.5" strokeLinecap="square"/>
              </svg>
            </div>
            <p style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '20px', color: C.text, textAlign: 'center', marginBottom: '8px' }}>No requests yet.</p>
            <p style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, textAlign: 'center' }}>When you request an introduction to a space, it will appear here.</p>
          </div>
        ) : (
          <div style={{ padding: '12px 16px' }}>
            {requests.map(req => (
              <div key={req.id} style={{ ...CARD, padding: '14px', marginBottom: '10px' }}>
                <div style={{ display: 'inline-block', background: '#FAFAF7', border: `1.5px solid ${C.borderDk}`, borderRadius: '1px', padding: '3px 8px', marginBottom: '10px' }}>
                  <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '9px', color: C.textSec, letterSpacing: '1.5px' }}>PREPARED · PROTOTYPE</span>
                </div>
                {req.space && <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '14px', color: C.text, marginBottom: '2px' }}>{req.space.name}</div>}
                {req.space && <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textSec, marginBottom: '8px' }}>{req.space.neighborhood}</div>}
                <div style={{ fontFamily: 'monospace', fontSize: '12px', color: C.text, marginBottom: '4px' }}>{req.projectTitle}</div>
                {req.connectMethod && <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, marginBottom: '3px' }}>→ {methodLabels[req.connectMethod] || req.connectMethod}</div>}
                {req.date && <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, marginBottom: '8px' }}>Preferred: {req.date}{req.time ? ` at ${req.time}` : ''}</div>}
                <div style={{ fontFamily: 'monospace', fontSize: '10px', color: C.textMut, fontStyle: 'italic', borderTop: `1px dashed ${C.border}`, paddingTop: '8px' }}>Awaiting space-holder response.</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  function ProfileScreen() {
    const hasProfile = contactName || contactEmail;
    return (
      <div style={{ paddingBottom: '72px' }}>
        <div style={{ padding: '16px 16px 12px', borderBottom: `1px solid ${C.border}` }}>
          <h2 style={{ fontFamily: "'Caveat', cursive", fontWeight: 700, fontSize: '26px', color: C.text }}>Profile</h2>
        </div>
        <div style={{ padding: '18px 16px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: '22px' }}>
            <div style={{ width: '66px', height: '66px', border: `2px solid ${C.borderDk}`, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '12px', background: C.card, boxShadow: `2px 2px 0 ${C.shadow}` }}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="7" r="4" stroke={C.textSec} strokeWidth="2"/>
                <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke={C.textSec} strokeWidth="2" strokeLinecap="square"/>
              </svg>
            </div>
            {hasProfile ? (
              <div style={{ textAlign: 'center' }}>
                {contactName && <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '16px', color: C.text }}>{contactName}</div>}
                {contactEmail && <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, marginTop: '4px' }}>{contactEmail}</div>}
              </div>
            ) : (
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontFamily: "'Caveat', cursive", fontWeight: 600, fontSize: '18px', color: C.text, marginBottom: '4px' }}>Set up your profile</div>
                <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec }}>Add your name and email when requesting a space.</div>
              </div>
            )}
          </div>
          <div style={{ ...CARD, overflow: 'hidden', marginBottom: '18px' }}>
            {[
              { label: 'Saved spaces', value: `${savedSpaces.length}`, onClick: () => { setScreen('saved'); setActiveNav('saved'); } },
              { label: 'Requests sent', value: `${requests.length}`, onClick: () => { setScreen('requests'); setActiveNav('requests'); } },
              { label: 'About POCKET', value: 'Prototype', onClick: null },
            ].map((row, i, arr) => (
              <div key={row.label} onClick={row.onClick} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', borderBottom: i < arr.length - 1 ? `1px solid ${C.border}` : 'none', cursor: row.onClick ? 'pointer' : 'default' }}>
                <span style={{ fontFamily: 'monospace', fontSize: '13px', color: C.text }}>{row.label}</span>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span style={{ fontFamily: 'monospace', fontSize: '12px', color: C.textSec }}>{row.value}</span>
                  {row.onClick && <span style={{ color: C.textSec, fontSize: '14px' }}>›</span>}
                </div>
              </div>
            ))}
          </div>
          <div style={{ border: `1px dashed ${C.borderDk}`, padding: '12px 14px', background: '#FAFAF7' }}>
            <div style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '9px', color: C.textSec, letterSpacing: '2px', marginBottom: '5px' }}>POCKET · PROTOTYPE</div>
            <div style={{ fontFamily: 'monospace', fontSize: '11px', color: C.textSec, lineHeight: '1.6' }}>Design prototype for a NYC creative space discovery app. No data is stored or transmitted.</div>
          </div>
        </div>
      </div>
    );
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  const renderScreen = () => {
    switch (screen) {
      case 'home':      return <HomeScreen />;
      case 'type':      return <TypeScreen />;
      case 'size':      return <SizeScreen />;
      case 'date':      return <DateScreen />;
      case 'location':  return <LocationScreen />;
      case 'budget':    return <BudgetScreen />;
      case 'results':   return <ResultsScreen />;
      case 'detail':    return <DetailScreen />;
      case 'signup':    return <SignupScreen />;
      case 'connect':   return <ConnectScreen />;
      case 'schedule':  return <ScheduleScreen />;
      case 'review':    return <ReviewScreen />;
      case 'confirm':   return <ConfirmScreen />;
      case 'saved':     return <SavedScreen />;
      case 'requests':  return <RequestsScreen />;
      case 'profile':   return <ProfileScreen />;
      default:          return <HomeScreen />;
    }
  };

  return (
    <div style={{ background: '#C5C8BE', minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
      <div style={{
        width: '390px', height: '844px',
        background: C.bg,
        borderRadius: '4px',
        overflow: 'hidden',
        position: 'relative',
        border: `2px solid ${C.ink}`,
        boxShadow: `6px 6px 0 ${C.accentDk}`,
      }}>
        <div style={{ height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column', position: 'relative' }}>
          <StatusBar />
          <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>
            {renderScreen()}
          </div>
          {showBottomNav && <BottomNav />}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

</body></html>
